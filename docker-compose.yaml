version: '3.7'

volumes:
  postgres-data:

services:
  postgres:
    container_name: enrollment_db
    image: postgres:14-alpine
    ports:
      - 5433:5432
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    container_name: redis_cache
    image: redis:7-alpine
    ports:
      - "6379:6379"
